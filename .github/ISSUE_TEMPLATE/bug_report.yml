name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the beta. Please do not paste passwords, tokens or other secrets.
  - type: input
    id: version
    attributes:
      label: WinTech Toolkit version
      description: Shown in the sidebar and in the About box.
      placeholder: 0.9.0-beta
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How did you start it?
      options: [WinTechToolkit.exe, irm | iex (start.ps1), Scripts from the zip, Console (module)]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and edition
      placeholder: Windows 11 23H2 Pro, domain-joined
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options: [Dashboard, System, Events, Integrity, Windows Update, Cleanup, User profiles, Credentials and access, Office and Teams, Programs, Startup and tasks, Network and domain, Printers, Remote computer, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Use the "copy log" button in the activity log, or the file in C:\ProgramData\WinTechToolkit\Logs. Remove computer or user names if you prefer.
      render: text
