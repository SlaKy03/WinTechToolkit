# Static checks (encoding, syntax, XAML, controls, functions) and the safety checks of the
# delete functions on every push and pull request
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checks
        shell: powershell
        run: |
          $out = & .\Build\Test-Toolkit.ps1
          $out
          if ($out -match 'Syntax errors: [1-9]|missing BOM|must NOT have a BOM|Missing controls|Undefined functions|Missing translations \(|Different placeholders \(|Untranslated XAML texts:') { exit 1 }

                - name: Safety checks
                  shell: powershell
                  run: |
                    $out = & .\Build\Test-Safety.ps1
                    $out | Select-Object -Last 15
                    if ($out -match '^FAIL') { exit 1 }
