# Static checks (encoding, syntax, XAML, controls, functions), the safety checks of the
# delete functions and PSScriptAnalyzer on every push and pull request
name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checks
        shell: powershell
        run: |
          $out = & .\Build\Test-Toolkit.ps1
          $out
          if ($out -match 'Syntax errors: [1-9]|missing BOM|must NOT have a BOM|Missing controls|Undefined functions|Missing translations \(|Different placeholders \(|Untranslated XAML texts:|^Init [A-Za-z]+:') { exit 1 }

      - name: Safety checks
        shell: powershell
        run: |
          $out = & .\Build\Test-Safety.ps1
          $out | Select-Object -Last 15
          if ($out -match '^FAIL') { exit 1 }

      - name: Static analysis (PSScriptAnalyzer)
        shell: powershell
        run: |
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          & .\Build\Test-Analyzer.ps1 -SelfTest
          if ($LASTEXITCODE) { exit 1 }
          & .\Build\Test-Analyzer.ps1
          if ($LASTEXITCODE) { exit 1 }
